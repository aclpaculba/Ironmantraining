<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raceplan</title>
<meta name="theme-color" content="#071017">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raceplan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECF1F4;--card:#FFFFFF;--card2:#F3F6F8;--ink:#0D1D26;--mute:#566B78;--line:rgba(13,29,38,.10);--line2:rgba(13,29,38,.20);
  --run:#D6392A;--swim:#0A74A8;--bike:#12805A;--race:#A06A00;--busy:#6D5CA0;--rest:#7A8D98;
  --z1:#7F95A1;--z2:#25968C;--z3:#55A82F;--z4:#D9970A;--z5:#DE4334;
  --k-wu:#2F7FC0;--k-skl:#5E9A1F;--k-main:#7C58D0;--k-spd:#D43E2D;--k-wd:#2F7FC0;--k-brick:#A06A00;--k-extra:#6D5CA0;
  --run-t:color-mix(in srgb,var(--run) 11%,transparent);
  --swim-t:color-mix(in srgb,var(--swim) 11%,transparent);
  --bike-t:color-mix(in srgb,var(--bike) 11%,transparent);
  --race-t:color-mix(in srgb,var(--race) 13%,transparent);
  --busy-t:color-mix(in srgb,var(--busy) 11%,transparent);
  --glass:rgba(255,255,255,.80);
  --lift:0 1px 2px rgba(13,29,38,.06),0 14px 34px rgba(13,29,38,.08);
  --f-head:"Big Shoulders Display","Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071017;--card:#0F1B24;--card2:#14242F;--ink:#E8F1F5;--mute:#8CA2AE;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.17);
    --run:#FF6F5B;--swim:#46C7F2;--bike:#38D39F;--race:#F5C451;--busy:#B5A6E0;--rest:#6F8591;
    --z1:#8EA4B0;--z2:#3FC3B6;--z3:#7BD14F;--z4:#F2B53A;--z5:#FF6B58;
    --k-wu:#5DA9E8;--k-skl:#9BD04A;--k-main:#A98CF0;--k-spd:#FF7B6A;--k-wd:#5DA9E8;--k-brick:#F2BC45;--k-extra:#B5A6E0;
    --glass:rgba(15,27,36,.78);
    --lift:0 0 0 1px rgba(255,255,255,.05),0 18px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071017;--card:#0F1B24;--card2:#14242F;--ink:#E8F1F5;--mute:#8CA2AE;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.17);
  --run:#FF6F5B;--swim:#46C7F2;--bike:#38D39F;--race:#F5C451;--busy:#B5A6E0;--rest:#6F8591;
  --z1:#8EA4B0;--z2:#3FC3B6;--z3:#7BD14F;--z4:#F2B53A;--z5:#FF6B58;
  --k-wu:#5DA9E8;--k-skl:#9BD04A;--k-main:#A98CF0;--k-spd:#FF7B6A;--k-wd:#5DA9E8;--k-brick:#F2BC45;--k-extra:#B5A6E0;
  --glass:rgba(15,27,36,.78);
  --lift:0 0 0 1px rgba(255,255,255,.05),0 18px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);min-height:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;letter-spacing:.2px}
a{color:inherit}
:focus-visible{outline:2px solid var(--swim);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:4px 16px 120px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);max-width:none;padding:10px 0 8px}
.top .in{max-width:560px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font:800 25px/1 var(--f-head);letter-spacing:.4px}
.mark{width:26px;height:26px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:99px;padding:5px 11px 5px 9px;font:600 14px/1 var(--f-body);color:var(--mute);background:var(--card)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--rest));display:inline-block}
.ph-base{--c:var(--swim)}.ph-build{--c:var(--bike)}.ph-peak{--c:var(--run)}.ph-taper{--c:var(--race)}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--mute);font-weight:600}

/* hero: the race dial */
.hero{position:relative;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:18px 18px 18px;margin:8px 0 14px;box-shadow:var(--lift);overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -30% auto -30%;height:80%;background:radial-gradient(closest-side,color-mix(in srgb,var(--swim) 16%,transparent),transparent);pointer-events:none}
.hero-top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-top h2{font-size:30px;line-height:1;font-weight:800}
.hero-top .pl{color:var(--mute);font-size:14px;margin-top:4px}
.dial{position:relative;width:min(100%,330px);aspect-ratio:1;margin:6px auto 0}
.dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial .wk{fill:none;stroke-linecap:round}
.dial .now{filter:drop-shadow(0 0 7px var(--c))}
.dial .trk{fill:none;stroke:var(--line);stroke-width:3}
.dial .prg{fill:none;stroke:url(#pg);stroke-width:3;stroke-linecap:round}
.dial-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dial-c .big{font:800 clamp(84px,27vw,112px)/.82 var(--f-head);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.dial-c .lab{font:600 17px/1 var(--f-body);color:var(--mute);margin-top:8px}
.dial-c .pc{margin-top:12px;font:600 13px/1 var(--f-body);color:var(--mute);border:1px solid var(--line2);border-radius:99px;padding:6px 11px}
.anim .wk{animation:drawin .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*22ms)}
.anim .prg{animation:sweep 1.1s cubic-bezier(.2,.7,.2,1) .15s both}
@keyframes drawin{from{opacity:0;stroke-width:0}}
@keyframes sweep{from{stroke-dasharray:0 100}}
.until{position:relative;display:flex;align-items:stretch;justify-content:center;gap:0;margin:14px 0 4px;background:var(--card2);border:1px solid var(--line);border-radius:18px}
.until div{flex:1;text-align:center;padding:12px 8px 11px}
.until div+div{border-left:1px solid var(--line)}
.until b{display:block;font:800 40px/.95 var(--f-head);font-variant-numeric:tabular-nums}
.until span{color:var(--mute);font-size:14px}
.rdate{position:relative;text-align:center;margin:10px 0 2px;font-weight:600;color:var(--mute)}
.pbar{position:relative;margin:16px 2px 4px}
.pbar .row{display:flex;gap:4px;height:10px}
.pbar .sg{position:relative;border-radius:5px;background:color-mix(in srgb,var(--c) 22%,transparent);overflow:hidden}
.pbar .sg i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:5px}
.pbar .mk{position:absolute;top:-7px;width:2px;height:24px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}
.pbar .mk::after{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--card)}
.pbar .lb{display:flex;gap:4px;margin-top:8px;font-size:12px;color:var(--mute)}
.pbar .lb span{overflow:hidden;white-space:nowrap}

/* today */
.today{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 16px 16px 20px;margin:0 0 6px;overflow:hidden;--c:var(--rest)}
.today::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.today .hd{display:flex;align-items:center;gap:8px;color:var(--c);font-weight:700;font-size:14px}
.today h3{font-size:34px;line-height:1;margin:8px 0 4px;font-weight:800}
.today .su{color:var(--mute);font-size:15px}
.mini{display:flex;gap:18px;margin:12px 0 14px}
.mini div{font:700 22px/1 var(--f-head)}
.mini small{display:block;font:500 12px/1.3 var(--f-body);color:var(--mute);margin-top:3px}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;background:var(--c);color:var(--bg);font:700 18px/1 var(--f-head);letter-spacing:.3px}
.go.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line2)}

/* week */
.wkh{display:flex;align-items:center;gap:8px;margin:20px 0 10px}
.wkh .t{flex:1;min-width:0}
.wkh h2{font-size:26px;line-height:1.05}
.wkh .s{color:var(--mute);font-size:14px;margin-top:2px}
.rb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center}
.rb:disabled{opacity:.3}
.rb:active{transform:scale(.94)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.tot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;--c:var(--rest)}
.tot .ic{color:var(--c)}
.tot b{font:700 21px/1 var(--f-head)}
.tot small{color:var(--mute);font-size:12px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 12px}
.dp{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 8px;border-radius:16px;border:1px solid var(--line);background:var(--card);--c:var(--rest)}
.dp small{font-size:12px;color:var(--mute);font-weight:600}
.dp b{font:700 20px/1 var(--f-head)}
.dp .mk{height:18px;display:grid;place-items:center;color:var(--c)}
.dp .mk .ic{width:15px;height:15px}
.dp .mk i{width:5px;height:5px;border-radius:50%;background:var(--line2)}
.dp.is-today b{color:var(--run)}
.dp.sel{background:var(--ink);border-color:var(--ink)}
.dp.sel small,.dp.sel b,.dp.sel .mk{color:var(--bg)}
.dp.sel.is-today b{color:var(--bg)}
.dp.dn::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--bike);box-shadow:0 0 0 2px var(--card)}
.dp.sel.dn::after{box-shadow:0 0 0 2px var(--ink)}
.sel-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 16px 20px;overflow:hidden;text-align:left;width:100%;display:block;--c:var(--rest)}
.sel-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.sel-card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--c);font-weight:700;font-size:14px}
.sel-card .hd span{display:flex;align-items:center;gap:7px}
.sel-card h3{font-size:30px;line-height:1.02;margin:8px 0 4px;font-weight:800;color:var(--ink)}
.sel-card .su{color:var(--mute);font-size:15px}
.sel-card.quiet{background:transparent;border-style:dashed}
.sel-card.quiet h3{font-size:24px;color:var(--mute)}
.sel-card .open{margin-top:12px;display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
button.sel-card:active{transform:scale(.99)}
.donetag{display:inline-flex;align-items:center;gap:5px;color:var(--bike);font-weight:700}
.cal{display:flex;align-items:center;gap:8px;margin:0 0 4px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs .bar{pointer-events:auto;display:flex;gap:4px;padding:5px;border-radius:24px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line2);box-shadow:var(--lift);width:100%;max-width:420px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;border-radius:19px;padding:8px 0 7px;color:var(--mute);font:600 12px/1 var(--f-body)}
.tabs button.on{background:var(--ink);color:var(--bg)}

/* sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:contain}
.sheet.two{z-index:35}
.sheet.pop{animation:up .34s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(34px);opacity:0}}
.sheet .in{max-width:560px;margin:0 auto;padding:0 16px 150px}
.sbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.sbar .grp{display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center}
.ib:disabled{opacity:.3}
.ib:active{transform:scale(.94)}
.whead{position:relative;margin:2px -16px 0;padding:14px 16px 18px;background:linear-gradient(to bottom,color-mix(in srgb,var(--c) 16%,transparent),transparent)}
.whead .kick{display:flex;align-items:center;gap:8px;color:var(--c);font-weight:700;font-size:15px}
.whead h1{font-size:46px;line-height:.96;margin:10px 0 8px;font-weight:800}
.whead .d{color:var(--mute);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{border:1px solid var(--line2);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--mute);background:var(--card)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 12px}
@media (min-width:520px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.st small{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:12px}
.st small .ic{width:14px;height:14px}
.st b{display:block;font:700 25px/1.05 var(--f-head);margin-top:5px;white-space:nowrap}
.st b i{font:500 13px var(--f-body);font-style:normal;color:var(--mute);margin-left:3px}
.bars{display:inline-flex;gap:3px;align-items:flex-end;height:16px;margin-right:7px;vertical-align:-1px}
.bars s{display:block;width:5px;background:var(--line2);border-radius:2px;text-decoration:none}
.bars s:nth-child(1){height:6px}.bars s:nth-child(2){height:11px}.bars s:nth-child(3){height:16px}
.bars.l1 s:nth-child(1){background:var(--bike)}
.bars.l2 s:nth-child(-n+2){background:var(--z4)}
.bars.l3 s{background:var(--run)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 12px 8px;margin:0 0 4px}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{font:11px var(--f-body);fill:var(--mute)}
.chart .sl{font:700 11px var(--f-head);fill:var(--mute);letter-spacing:.4px}
.zleg{display:flex;gap:12px;flex-wrap:wrap;margin:8px 4px 2px;font-size:12px;color:var(--mute)}
.zleg span{display:inline-flex;align-items:center;gap:5px}
.zleg i{width:9px;height:9px;border-radius:3px;background:var(--zc)}
.coach{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 0}
.coach .who{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.coach .who b{display:block;font:700 20px/1 var(--f-head)}
.coach .who small{color:var(--mute);font-size:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--c);color:var(--bg);display:grid;place-items:center;flex:none}
.coach p{margin:0;font-size:16.5px;line-height:1.55}
.src{color:var(--mute);font-size:12px;margin-top:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.src button{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line2);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--ink)}
.src .ic{width:14px;height:14px;color:var(--busy)}
.sec{font:800 26px/1 var(--f-head);margin:24px 0 10px}
.rail{position:relative;margin-left:8px;padding-left:18px;border-left:2px solid var(--line2)}
.rsec{position:relative;margin:0 0 18px}
.rsec::before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--k);border:3px solid var(--bg)}
.sp{display:inline-block;font:700 17px/1 var(--f-head);letter-spacing:.3px;padding:6px 12px 5px;border-radius:99px;background:color-mix(in srgb,var(--k) 15%,transparent);color:var(--k);margin:0 0 8px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:7px 0;position:relative}
.it .big{font-size:17px;padding-right:76px}
.it .big b{font:800 32px/1 var(--f-head);margin-right:4px}
.it .tg{position:absolute;right:12px;top:13px;font-size:12px;font-weight:700;color:var(--k);background:color-mix(in srgb,var(--k) 14%,transparent);padding:3px 9px;border-radius:99px}
.it .sb{color:var(--mute);font-size:14px;margin-top:4px}
.it .ln{margin-top:5px;font-size:16px}
.it .ln b{font:800 24px/1 var(--f-head)}
.it .nt{color:var(--mute);font-size:14px;margin-top:5px}
.zc{font-weight:700}
.zc.z1{color:var(--z1)}.zc.z2{color:var(--z2)}.zc.z3{color:var(--z3)}.zc.z4{color:var(--z4)}.zc.z5{color:var(--z5)}
.rep{border:1.5px solid color-mix(in srgb,var(--race) 55%,transparent);border-radius:16px;padding:4px 10px 8px;margin:8px 0;background:var(--race-t)}
.rep>.rh{display:flex;align-items:center;gap:6px;font:700 19px var(--f-head);color:var(--race);margin:7px 0 2px}
.rep>.rh .ic{width:16px;height:16px}
.rep .it{margin:6px 0;background:var(--card)}
.rest{display:inline-block;border:1px solid var(--line2);border-radius:99px;padding:2px 9px;font-size:12px;margin-top:9px;color:var(--mute)}
.feel{font-size:14px;color:var(--mute);margin:8px 2px 0;padding:2px 0 2px 11px;border-left:3px solid color-mix(in srgb,var(--k) 60%,transparent)}
.feel i{color:var(--ink);font-style:normal;font-weight:700}
.cards2{display:grid;gap:10px}
.info{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.info h3{display:flex;align-items:center;gap:8px;font:800 21px/1 var(--f-head);margin-bottom:6px}
.info h3 .ic{color:var(--c)}
.list{margin:0;padding:0;list-style:none}
.list li{padding:8px 0 8px 18px;position:relative;border-top:1px solid var(--line);font-size:15px}
.list li:first-child{border-top:0}
.list li::before{content:"";position:absolute;left:2px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--c)}
.note{color:var(--mute);font-size:13px;margin-top:8px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:22px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 62%,transparent);z-index:31}

  function zn(st,idx){return st.zoneSeq?st.zoneSeq[idx%st.zoneSeq.length]:st.zone}
  function one(st,kind,idx){
    var z=zn(st,idx);
    if(st.parts)st.parts.forEach(function(pt){out.push({sec:swimSec(pt.dist,pt.zone),zone:pt.zone,dist:pt.dist,kind:kind,sp:"swim"})});
    else if(w.sport==="swim"&&st.dist&&!st.sp)out.push({sec:swimSec(st.dist,z),zone:z,dist:st.dist,kind:kind,sp:"swim"});
    else out.push({sec:st.sec,zone:z,kind:kind,sp:st.sp||w.sport});
    if(st.rest)out.push({sec:st.rest,zone:0,kind:kind,rest:1});
  }
  function walk(items,kind,idx){
    items.forEach(function(it){
      if(it.k==="note")return;
      if(it.k==="rep"){for(var n=0;n<it.n;n++){walk(it.items,kind,n);if(it.rest&&n<it.n-1)out.push({sec:it.rest,zone:0,kind:kind,rest:1})}}
      else one(it,kind,idx||0);
    });
  }
  w.sections.forEach(function(s){walk(s.items,s.kind,0)});
  return out;
}
function idist(items){
  var d=0;
  items.forEach(function(it){d+=it.k==="rep"?it.n*idist(it.items):(it.dist||0)});
  return d;
}
function finish(w,c){
  ZC=c.Z;var Z=c.Z;
  if(w.sport==="race"){w.seg=[];return w}
  w.seg=flat(w);
  var tot=0,tss=0,ifs=0,work=0,swimD=0,runKm=0,bikeKm=0,brickKm=0;
  w.seg.forEach(function(s){
    tot+=s.sec;
    if(s.rest)return;
    var f=ZI[s.zone];tss+=s.sec/3600*f*f*100;ifs+=s.sec*f;work+=s.sec;
    if(s.sp==="swim")swimD+=s.dist||0;
    else if(s.sp==="run"){var k=s.sec/mid(Z.run.z[s.zone]);runKm+=k;if(w.sport==="bike")brickKm+=k}
    else if(s.sp==="bike")bikeKm+=s.sec/3600*Z.bike.spd[s.zone];
  });
  w.mins=Math.round(tot/60);
  w.load=Math.round(10*(1-Math.exp(-tss/150))*10)/10;
  var avg=work?ifs/work:0;
  w.intensity=avg<0.72?1:avg<0.86?2:3;
  w.swimD=swimD;w.km=w.sport==="run"?runKm:brickKm;w.bikeKm=bikeKm;w.brickKm=brickKm;
  if(w.sport==="swim"){w.dist=swimD;w.pace=tot/(swimD/100)}
  else if(w.sport==="run"){w.dist=runKm;w.pace=tot/runKm}
  else w.dist=bikeKm;
  if(w.sport!=="swim"&&tot>=3600){var rate=tot>=14400?75:tot>=10800?65:tot>=5400?50:35;w.carbs=Math.round(tot/3600*rate)}else w.carbs=0;
  if(w.sport==="swim")w.sub=Math.round(swimD).toLocaleString("en-US")+" "+swU()+" · about "+fmtMin(w.mins);
  else if(w.sport==="run")w.sub=fmtKm(runKm)+" · about "+fmtMin(w.mins);
  else w.sub=fmtMin(w.mins)+" · "+fmtKm(bikeKm)+(brickKm?" + "+fmtKm(brickKm)+" run":"");
  return w;
}

 "run-easy":"Keep this honest and easy. If you feel like you are holding back, that is the point. Relaxed shoulders, breathing you barely notice, and a stride that feels light. Easy days are what let you absorb the harder work.",

  if(k==="skl")return "Slow and precise, about 3 out of 10. Focus on how it feels rather than how fast it is.";
  if(k==="wd")return "Back to easy. Let your heart rate settle and your muscles loosen. You should finish feeling better than you started.";
  if(k==="spd")return "Fast and quick, but relaxed. The effort is high for a short burst, then you recover fully so every rep feels crisp.";

  if(w.kind==="long"&&mz<=2)return "Patient and steady, about 4 out of 10. Almost too easy early. Fuel on schedule and keep the effort the same from start to finish.";
  if(mz<=2)return "Comfortable but working, 4–5 out of 10. You can speak in short sentences and your breathing is steady.";

/* ============ plan builder ============ */
function assignDays(types,avail,longDay){
  var PD=longDay==="sat"?5:6,OD=PD===5?6:5;
  var free=[];avail.forEach(function(a,d){if(a==="free")free.push(d)});
  var HARD={runLong:1,runQ:1,bikeLong:1,bikeQ:1};
  var best=null,bc=1e9,used=new Array(7).fill(null);
  function cost(){
    var c=0;
    for(var d=0;d<7;d++){
      var t=used[d],n=(d+1)%7,tn=used[n],n2=(d+2)%7;
      var sh=t&&HARD[t],shn=tn&&HARD[tn];
      if(sh&&shn)c+=5;
      else if((sh&&avail[n]==="busy")||(shn&&avail[d]==="busy"))c+=2.5;
      if(t&&tn&&t.indexOf("run")===0&&tn.indexOf("run")===0)c+=1.2;
      if(t&&tn&&used[n2])c+=0.8;
      if(t==="runLong")c+=d===PD?0:d===OD?0.6:d===4?2.5:3;
      if(t==="bikeLong")c+=d===OD?0:d===PD?0.6:d===4?2.5:3;
    }
    return c;
  }
  function rec(ti){
    if(ti===types.length){var c=cost();if(c<bc){bc=c;best=used.slice()}return}
    for(var k=0;k<free.length;k++){var d=free[k];if(used[d]===null){used[d]=types[ti];rec(ti+1);used[d]=null}}
  }
  rec(0);
  return best||new Array(7).fill(null);
}

function make(t,c){
  var rw=c.rw,Lr=c.Lref,tri=isTri(c.p.goal),bk=c.brick;
  switch(t){
    case "runLong":return rw?runEasy(c,5,{title:"Easy Shakeout Run"}):runLong(c,Math.max(c.L,4));
    case "runQ":return rw?runQ(c,5,"sharp"):runQ(c,clamp(Math.round(Lr*0.55),5,14));
    case "runEasy":return runEasy(c,rw?4:clamp(Math.round(Lr*0.42),4,11));
    case "runEasy2":return runEasy(c,rw?3:clamp(Math.round(Lr*0.36),3,9));
    case "runEasy3":return runEasy(c,rw?3:clamp(Math.round(Lr*0.33),3,7));
    case "swim":return swimWo(c,rw?c.S*0.5:c.S,"aerobic");
    case "swim2":return swimWo(c,rw?c.S*0.45:c.S*0.8,"speed");
    case "bikeLong":return rw?bikeWo(c,40,"endurance",{title:"Easy Spin"}):bikeWo(c,c.Bm,"long",{brick:bk});
    case "bike":return rw?bikeWo(c,40,"endurance",{title:"Easy Spin"}):bikeWo(c,tri?clamp(c.Bm*0.5,45,150):c.Bm,"endurance");
    case "bikeQ":return rw?bikeWo(c,40,"openers"):bikeWo(c,tri?clamp(c.Bm*0.45,60,105):clamp(c.Bm*0.65,40,90),"quality");
  }
  return null;
}

function buildPlan(p){
  var Z=zones(p),g=p.goal,lv=p.level,tri=isTri(g),lvR=LV(p,"Run"),lvS=LV(p,"Swim"),lvB=LV(p,"Bike");
  var cyc=(p.stress==="high"||(p.sleepAvg&&p.sleepAvg<6.5)||(p.age&&p.age>=50))?3:4;
  var race=pdate(p.raceDate),raceMon=monOf(race),start=pdate(p.startDate);
  var MAXW=tri?30:26,notes=[];
  if(diffDays(raceMon,start)<0)start=raceMon;
  var late=false;
  if(diffDays(raceMon,start)/7>MAXW-1){start=addD(raceMon,-(MAXW-1)*7);late=true}
  var N=Math.round(diffDays(raceMon,start)/7)+1;
  var T=Math.min({ironman:3,"703":2,marathon:3,half:2,"10k":2}[g],Math.max(1,Math.floor(N/4)));
  var pre=N-T,base=Math.round(pre*0.4),build=Math.round(pre*0.4);
  function phaseOf(i){return i>=pre?"taper":i<base?"base":i<base+build?"build":"peak"}
  function isRec(i){return i>=1&&i<pre-1&&pre>=6&&(i+1)%cyc===0}
  function ramp(lo,hi,i){
    function raw(j){return lo+(hi-lo)*(pre>1?j/(pre-1):1)}
    return isRec(i)?0.75*raw(i-1):raw(i);
  }
  var peakLR={ironman:26,"703":19,marathon:32,half:19,"10k":13}[g];
  if(lvR==="new")peakLR=Math.round(peakLR*0.92);
  var L0=Math.min(clamp(p.longestRun||({"new":5,some:9,exp:13})[lvR],3,peakLR*0.85),peakLR*0.8);
  var nonRec=0;for(var q=0;q<pre;q++)if(!isRec(q))nonRec++;
  var effPeak=Math.min(peakLR,L0+2*Math.max(1,nonRec-1));
  var bmi=(p.weightKg&&p.heightCm)?p.weightKg/Math.pow(p.heightCm/100,2):null;
  var heavy=bmi&&bmi>=30;
  if(heavy)effPeak*=0.94;
  if(p.runCaution)effPeak*=0.92;
  effPeak=Math.round(effPeak);
  var capped=effPeak<peakLR-1;
  var peakS=g==="ironman"?({"new":3000,some:3800,exp:4500})[lvS]:g==="703"?({"new":2400,some:3000,exp:3600})[lvS]:({"new":1000,some:1500,exp:2000})[lvS];
  var S0=clamp(p.longestSwim?p.longestSwim*0.9:({"new":500,some:1000,exp:1500})[lvS],300,peakS*0.7);
  var peakB=g==="ironman"?({"new":240,some:300,exp:360})[lvB]:g==="703"?({"new":150,some:180,exp:210})[lvB]:({"new":60,some:80,exp:100})[lvB];
  var B0=clamp(p.longestRide||({"new":40,some:60,exp:75})[lvB]*(tri?1.4:1),30,peakB*0.75);
  var tvol={1:[0.5],2:[0.7,0.45],3:[0.8,0.6,0.4]}[T],tlong={1:[0],2:[0.6,0],3:[0.75,0.55,0]}[T];

  var cap=(p.swim||p.bike)?({"new":4,some:5,exp:6})[lv]:({"new":3,some:4,exp:5})[lv];
  var pri;
  if(g==="ironman"){pri=["bikeLong","runLong","swim","bikeQ","runQ","swim2","bike"];cap=({"new":5,some:6,exp:7})[lv]}
  else if(g==="703"){pri=["bikeLong","runLong","swim","bikeQ","runQ","swim2","runEasy"];cap=({"new":5,some:6,exp:6})[lv]}
  else if(p.swim&&p.bike)pri=["runLong","runQ","swim","bike","runEasy","swim2","bikeQ"];
  else if(p.swim)pri=["runLong","runQ","swim","runEasy","swim2","runEasy2"];
  else if(p.bike)pri=["runLong","runQ","bike","runEasy","bikeQ","runEasy2"];
  else pri=["runLong","runQ","runEasy","runEasy2","runEasy3"];
  var freeN=p.avail.filter(function(a){return a==="free"}).length;
  var types=pri.slice(0,Math.min(cap,freeN,6+(tri&&freeN<7?1:0)));
  var assignment=assignDays(types,p.avail,p.longDay);

  var minW={ironman:20,"703":12,marathon:12,half:8,"10k":6}[g];
  if(N<minW&&!late)notes.push({warn:true,t:"Your race is only "+N+" week"+(N===1?"":"s")+" away. "+p.raceName+" plans usually run "+minW+"+ weeks, so the build is compressed. Keep the long sessions honest and skip workouts rather than stacking them."});
  if(late)notes.push({t:"Your race is far enough away that the plan starts on "+fmtDateY(start)+". Until then, keep a relaxed routine of easy running, swimming and riding."});
  if(capped&&!heavy)notes.push({warn:true,t:"With your current long run and the time left, the longest run in this plan tops out at "+fmtKm(effPeak)+" rather than the usual "+fmtKm(peakLR)+"."});
  if(heavy)notes.push({t:"A gentler mileage ramp was applied based on your height and weight. Walk breaks are always fine."});
  if(freeN<3)notes.push({warn:true,t:"You marked "+freeN+" training day"+(freeN===1?"":"s")+". That is enough to keep going, but "+(tri?"triathlon training needs 5 or more days for a good build":"3 or more gives a smoother build")+"."});
  if(tri&&freeN<5&&freeN>=3)notes.push({warn:true,t:"Ironman-distance training usually needs 5–6 training days a week. With "+freeN+", the plan keeps your key sessions and drops the rest."});
  if(Z.run.est)notes.push({t:"Run paces are estimated from your experience level. Add a recent 5K time in Setup for personal paces."});
  if((p.swim||tri)&&Z.swim.est)notes.push({t:"Swim paces are estimated. Add a recent 400 time in Setup to personalise them."});
  if(p.runCaution)notes.push({t:"You noted a running-related niggle ("+(p.injuries||[]).join(", ")+"). The run build is gentler, and hill and fast interval sessions are swapped for easier versions."});
  if((p.injuries||[]).indexOf("shoulder")>=0&&(p.swim||tri))notes.push({t:"You noted a shoulder issue. Skip the fast 25s if they hurt, and stop any drill that pinches."});
  if(cyc===3)notes.push({t:"Recovery weeks come every third week instead of every fourth, based on your sleep, stress or age."});
  if(tri&&p.weeklyHours&&p.weeklyHours<({ironman:5,"703":4})[g])notes.push({warn:true,t:"You are training about "+p.weeklyHours+" hours a week now. Ironman-distance plans ramp quickly, so expect the first weeks to feel like a step up."});
  if(p.goalSec&&Z.run.gp){var predPace={marathon:Z.run.p5*1.15,half:Z.run.p5*1.08,"10k":Z.run.p5*1.045}[g];if(predPace&&Z.run.gp<predPace*0.94)notes.push({warn:true,t:"Your goal pace is much faster than your current 5K suggests. Goal-pace work uses your target, so update your 5K time as you improve and listen to your body."})}

  var weeks=[];
  for(var i=0;i<N;i++){
    var monday=addD(start,i*7),phase=phaseOf(i),isT=i>=pre,k=i-pre,rw=(i===N-1);
    var r=!isT&&isRec(i),L,vf=1;
    if(isT){vf=tvol[k];L=Math.round(effPeak*tlong[k])}else L=Math.round(ramp(L0,effPeak,i));
    var f=(isT?1:(pre>1?i/(pre-1):1))*(r?0.85:1);
    var c={p:p,Z:Z,phase:phase,rec:r,i:i,rw:rw,L:L,Lref:isT?effPeak*vf:L,f:f,
      S:isT?peakS*vf:ramp(S0,peakS,i),Bm:isT?peakB*vf:ramp(B0,peakB,i),
      brick:(tri&&!r&&!rw&&!isT&&(phase==="build"||phase==="peak"))?Math.round((15+f*15)/5)*5:0};
    var days=[];
    for(var d=0;d<7;d++){
      var date=addD(monday,d),dk=dkey(date),w;
      if(dk===p.raceDate)w=finish(raceWorkout(c),c);
      else if(date>race)w={sport:"rest",title:"Recover",sub:"Walk, stretch, eat well. You earned it."};
      else if(p.avail[d]==="busy")w={sport:"busy",title:p.busy[d]||"Other training",sub:"Busy"};
      else if(assignment[d]){
        if(rw&&diffDays(race,date)===1)w={sport:"rest",title:"Rest before race",sub:"Legs up, hydrate, lay out your kit."};
        else{var wk0=make(assignment[d],c);w=finish(wk0,c)}
      } else w={sport:"rest",title:"Rest",sub:"Rest"};
      w.date=dk;w.phase=phase;w.week=i+1;w.daysToRace=diffDays(race,date);
      days.push(w);
    }
    var mins=0,runKm=0,swimD=0,bikeMin=0;
    days.forEach(function(w){mins+=w.mins||0;if(w.sport==="run"||w.sport==="bike")runKm+=w.km||0;if(w.sport==="swim")swimD+=w.swimD||0;if(w.sport==="bike")bikeMin+=w.mins||0});
    weeks.push({i:i,monday:monday,phase:phase,rec:r,days:days,mins:mins,runKm:runKm,swimD:swimD,bikeMin:bikeMin});
  }
  return {weeks:weeks,N:N,T:T,pre:pre,notes:notes,Z:Z,start:start,race:race,effPeak:effPeak,peakLR:peakLR,types:types};
}

/* Each username has its own data. It is kept in this browser and mirrored to the server (api/user). */
function ukey(){return KEY+".u."+S.user}
function applyData(o){
  S.profile=o.profile||null;S.done=o.done||{};S.ready=o.ready||{};S.chat=o.chat||{};S.cc=Array.isArray(o.cc)?o.cc:[];
  S.rtime=/^\d\d:\d\d$/.test(o.rtime||"")?o.rtime:"07:00";S.ts=Number(o.ts)||0;
  PLAN=null;
}
function clearData(){applyData({});S.tab="plan";S.ptab="you";S.open=null;S.checkin=null;S.sel=null;S.editing=false;S.confirm=false;S.draft=null;S.step=0;S.week=0;S.pushOn=false;S.pushMsg="";S.coachErr="";S.askText="";S.chatText=""}
function readLocal(){try{var j=localStorage.getItem(ukey());return j?JSON.parse(j):null}catch(e){return null}}
function load(){
  try{S.user=localStorage.getItem(KEY+".user")||"";S.display=localStorage.getItem(KEY+".disp")||S.user}catch(e){}
  if(S.user){var o=readLocal();if(o)applyData(o)}
  try{S.pass=localStorage.getItem(KEY+".pass")||""}catch(e){}
}
function snapshot(){return {profile:S.profile,done:S.done,ready:S.ready,chat:pruneChat(),cc:S.cc,rtime:S.rtime,ts:S.ts}}

var SYNCTO=null;
function save(){
  if(!S.user)return;
  S.ts=Date.now();
  try{localStorage.setItem(ukey(),JSON.stringify(snapshot()))}catch(e){}
  clearTimeout(SYNCTO);SYNCTO=setTimeout(syncUp,800);
}
function userApi(body,keepalive){
  var headers={"Content-Type":"application/json"};if(S.pass)headers["x-app-passcode"]=S.pass;
  var payload=JSON.stringify(body);
  return fetch("api/user",{method:"POST",headers:headers,body:payload,keepalive:!!keepalive&&payload.length<60000}).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(r.status===401){S.needPass=true}
      if(!r.ok){var e=new Error(j.message||"Something went wrong. Try again.");e.code=r.status===401?"passcode":(j.error||"server");throw e}
      return j;
    });
  });
}
function syncUp(keepalive){
  clearTimeout(SYNCTO);SYNCTO=null;
  if(!S.user)return Promise.resolve();
  return userApi({action:"save",username:S.user,data:snapshot(),ts:S.ts},keepalive===true).catch(function(){});
}
/* On open: if the server has newer data (for example from another device), use it. */
function pullUser(){
  if(!S.user)return;
  var who=S.user;
  userApi({action:"get",username:who}).then(function(j){
    if(S.user!==who)return;
    var st=Number(j.ts)||0;
    if(!j.data||st<=S.ts||S.editing){if(S.ts>st)syncUp();return}
    applyData(Object.assign({},j.data,{ts:j.ts}));
    try{localStorage.setItem(ukey(),JSON.stringify(snapshot()))}catch(e){}
    if(S.profile){S.draft=null;try{S.week=todayWeek(plan())}catch(e){S.week=0}}
    render();
  }).catch(function(){});
}

function plan(){if(!PLAN)PLAN=buildPlan(S.profile);return PLAN}
function todayWeek(P){return clamp(Math.floor(diffDays(new Date(),P.start)/7),0,P.N-1)}
function findW(P,k){for(var i=0;i<P.weeks.length;i++)for(var j=0;j<7;j++)if(P.weeks[i].days[j].date===k)return P.weeks[i].days[j];return null}

/* ============ workout text ============ */
function itemTxt(it,w){
  var Z=ZC;
  if(it.k==="note")return it.text;
  if(it.k==="rep")return it.n+" × ["+it.items.map(function(x){return itemTxt(x,w)}).join("; ")+"]"+(it.tag?" ("+it.tag+")":"");
  var rest=it.rest?", "+it.rest+"s rest":"";
  if(it.parts)return it.parts.map(function(p){return p.dist+" "+swU()+" "+p.text+" Z"+p.zone}).join(" + ")+rest;
  if(w.sport==="swim"&&!it.sp)return it.dist+" "+swU()+" "+it.text+" Z"+(it.zoneSeq?it.zoneSeq.join("→"):it.zone)+rest+(it.note?" ("+it.note+")":"");
  return Math.round(it.sec/60*10)/10+" min z"+it.zone+(it.note?" ("+it.note+")":"")+(it.sp==="run"?" run":"");
}

function polar(cx,cy,r,deg){var a=deg*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function arcPath(cx,cy,r,a0,a1){var p0=polar(cx,cy,r,a0),p1=polar(cx,cy,r,a1);return "M"+p0[0].toFixed(2)+" "+p0[1].toFixed(2)+" A"+r+" "+r+" 0 "+((a1-a0)>180?1:0)+" 1 "+p1[0].toFixed(2)+" "+p1[1].toFixed(2)}

function raceInfo(p){return p.raceId&&p.raceId!=="custom"?raceById(p.raceId):null}
function allW(P){var out=[];P.weeks.forEach(function(wk){wk.days.forEach(function(w){if(w.sections)out.push(w)})});return out}

/* the race dial: one arc per training week, coloured by phase */
function heroHtml(P){
  var p=S.profile,today=sod(new Date()),left=diffDays(P.race,today),cur=todayWeek(P),N=P.N;
  var totalDays=Math.max(1,diffDays(P.race,P.start)),el=clamp(diffDays(today,P.start),0,totalDays),frac=clamp(el/totalDays,0,1);
  var pos=Math.max(0,left),wA=Math.floor(pos/7),dA=pos%7,rc=raceInfo(p);
  var svg='<svg viewBox="0 0 320 320" aria-hidden="true"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--swim)"/><stop offset="1" style="stop-color:var(--run)"/></linearGradient></defs>';
  var gap=Math.min(3.4,90/N),R=140;
  for(var i=0;i<N;i++){
    var a0=-90+i*360/N+gap/2,a1=-90+(i+1)*360/N-gap/2,ph=P.weeks[i].phase,isNow=(i===cur&&left>=0);
    var op=left<0||i<=cur?1:0.26;
    svg+='<path class="wk'+(isNow?" now":"")+'" style="--i:'+i+';--c:var(--'+PHC[ph]+');stroke:var(--'+PHC[ph]+');stroke-width:'+(isNow?18:12)+'px;opacity:'+op+'" d="'+arcPath(160,160,R,a0,a1)+'"/>';
  }
  svg+='<circle class="trk" cx="160" cy="160" r="114"/>';
  svg+='<circle class="prg" cx="160" cy="160" r="114" pathLength="100" stroke-dasharray="'+(frac*100).toFixed(2)+' 100" transform="rotate(-90 160 160)"/>';
  var kp=polar(160,160,114,-90+frac*360);
  svg+='<circle cx="'+kp[0].toFixed(1)+'" cy="'+kp[1].toFixed(1)+'" r="6" style="fill:var(--ink);stroke:var(--card);stroke-width:3px"/></svg>';
  var big,lab;
  if(left>0){big='<div class="big" data-count="'+left+'">'+left+'</div>';lab=(left===1?"day":"days")+" to go"}
  else if(left===0){big='<div class="big" style="font-size:64px;line-height:.9">Race day</div>';lab="Go get it"}
  else{big='<div class="big" style="font-size:58px;line-height:.9">Done</div>';lab="Race complete"}
  var segs=[];P.weeks.forEach(function(w,i){var l=segs[segs.length-1];if(l&&l.ph===w.phase)l.n++;else segs.push({ph:w.phase,n:1,start:i})});
  var curPos=clamp(el/7,0,N);
  var bar='<div class="pbar"><div class="row">'+segs.map(function(s){return '<div class="sg" style="flex:'+s.n+';--c:var(--'+PHC[s.ph]+')"><i style="width:'+Math.round(clamp((curPos-s.start)/s.n,0,1)*100)+'%"></i></div>'}).join("")+'</div><div class="mk" style="left:'+(curPos/N*100).toFixed(2)+'%"></div><div class="lb">'+segs.map(function(s){return '<span style="flex:'+s.n+'">'+(s.n>=2?PH[s.ph]+' '+s.n+'w':'')+'</span>'}).join("")+'</div></div>';
  var h='<section class="hero'+(S.anim?" anim":"")+'"><div class="hero-top"><div><h2>'+esc(p.raceName)+'</h2><div class="pl">'+(rc?esc(rc.pl)+'<br>':'')+DAYL[(P.race.getDay()+6)%7]+' '+P.race.getDate()+' '+MON[P.race.getMonth()]+' '+P.race.getFullYear()+'</div></div><span class="chip ph-'+P.weeks[cur].phase+'"><i class="dot"></i>'+PH[P.weeks[cur].phase]+'</span></div>';
  h+='<div class="dial">'+svg+'<div class="dial-c">'+big+'<div class="lab">'+lab+'</div><div class="pc">'+Math.round(frac*100)+'% of the plan done</div></div></div>';
  h+='<div class="until"><div><b data-count="'+wA+'">'+wA+'</b><span>'+(wA===1?"week":"weeks")+' away</span></div><div><b data-count="'+dA+'">'+dA+'</b><span>'+(dA===1?"day":"days")+' more</span></div><div><b>'+(cur+1)+'<span style="font:600 18px var(--f-head);color:var(--mute)">/'+N+'</span></b><span>plan week</span></div></div>';
  h+=bar+'</section>';
  return h;
}

function miniStats(w){
  if(!w.mins)return "";
  var d=w.sport==="swim"?[Math.round(w.dist).toLocaleString("en-US"),swU()]:kmParts(w.dist);
  return '<div class="mini"><div>'+fmtMin(w.mins)+'<small>time</small></div><div>'+d[0]+' '+d[1]+'<small>distance</small></div><div>'+w.load.toFixed(1)+'<small>load of 10</small></div></div>';
}
function todayCard(P){
  var today=sod(new Date()),tk=dkey(today),w=findW(P,tk),up=null;
  if(!(w&&w.sections)){
    var all=allW(P);for(var i=0;i<all.length;i++){if(all[i].date>tk){up=all[i];break}}
    if(!up)return '<div class="today"><div class="hd">'+ic("race")+' Plan complete</div><h3>Nothing left to do</h3><div class="su">Rest up and enjoy it.</div></div>';
    var d=pdate(up.date);
    return '<div class="today" style="--c:var(--rest)"><div class="hd">'+ic("rest")+' No workout today</div><h3>'+(w&&w.sport==="busy"?esc(w.title):"Rest and recover")+'</h3><div class="su">Next up: '+esc(up.title)+' on '+fmtDate(d)+'.</div><div style="height:12px"></div><button class="go ghost" data-act="open" data-k="'+up.date+'">Preview next workout '+ic("fwd")+'</button></div>';
  }
  var done=!!S.done[w.date];
  return '<div class="today" style="--c:var(--'+w.sport+')"><div class="hd">'+ic(w.sport)+' Today'+(done?' <span class="donetag">'+ic("check")+' Done</span>':'')+'</div><h3>'+esc(w.title)+'</h3><div class="su">'+esc(w.sub)+'</div>'+miniStats(w)+(w.sport==="race"?"":readyRow(w.date))+'<button class="go" data-act="open" data-k="'+w.date+'">'+(done?"View workout":"Open workout")+' '+ic("fwd")+'</button></div>';
}

function ensureSel(wk){
  if(wk.days.some(function(d){return d.date===S.sel}))return;
  var tk=dkey(sod(new Date())),t=wk.days.filter(function(d){return d.date===tk})[0];
  if(t){S.sel=t.date;return}
  var f=wk.days.filter(function(d){return d.sections})[0];
  S.sel=(f||wk.days[0]).date;
}
function planView(P){
  var wk=P.weeks[S.week],tk=dkey(sod(new Date())),p=S.profile;
  ensureSel(wk);
  var h=heroHtml(P);
  P.notes.filter(function(n){return n.warn}).forEach(function(n){h+='<div class="callout">'+esc(n.t)+'</div>'});
  h+=todayCard(P);
  h+='<div class="wkh"><button class="rb" data-act="wk" data-d="-1" '+(S.week===0?"disabled":"")+' aria-label="Previous week">'+ic("back")+'</button><div class="t"><h2>Week '+(wk.i+1)+' of '+P.N+'</h2><div class="s"><span class="chip ph-'+wk.phase+'" style="padding:3px 9px 3px 8px;font-size:12px"><i class="dot"></i>'+PH[wk.phase]+(wk.rec?" recovery":"")+'</span> '+fmtDate(wk.monday)+' to '+fmtDate(addD(wk.monday,6))+'</div></div><button class="rb" data-act="wk" data-d="1" '+(S.week===P.N-1?"disabled":"")+' aria-label="Next week">'+ic("fwd")+'</button></div>';
  if(S.week!==todayWeek(P))h+='<button class="btn alt sm" data-act="thisweek" style="margin:0 0 10px">Jump to this week</button>';
  var tl='';
  if(p.swim)tl+='<div class="tot" style="--c:var(--swim)">'+ic("swim")+'<b>'+Math.round(wk.swimD/100)*100+' '+swU()+'</b><small>swim</small></div>';
  if(p.bike)tl+='<div class="tot" style="--c:var(--bike)">'+ic("bike")+'<b>'+(wk.bikeMin/60).toFixed(1)+' h</b><small>bike</small></div>';
  tl+='<div class="tot" style="--c:var(--run)">'+ic("run")+'<b>'+fmtKm(wk.runKm)+'</b><small>run</small></div>';
  h+='<div class="totals" style="grid-template-columns:repeat('+((p.swim?1:0)+(p.bike?1:0)+1)+',1fr)">'+tl+'</div>';
  h+='<div class="strip">'+wk.days.map(function(w,d){
    var date=pdate(w.date),cls="dp"+(w.date===S.sel?" sel":"")+(w.date===tk?" is-today":"")+(S.done[w.date]?" dn":"");
    var mk=w.sections?ic(w.sport):(w.sport==="busy"?ic("busy"):'<i></i>');
    return '<button class="'+cls+'" data-act="sel" data-k="'+w.date+'" style="--c:var(--'+(w.sections?w.sport:"rest")+')" aria-label="'+DAYL[d]+' '+date.getDate()+'"><small>'+DAYS[d]+'</small><b>'+date.getDate()+'</b><span class="mk">'+mk+'</span></button>';
  }).join("")+'</div>';
  var s=findW(P,S.sel);
  if(s&&s.sections){
    h+='<button class="sel-card" style="--c:var(--'+s.sport+')" data-act="open" data-k="'+s.date+'"><div class="hd"><span>'+ic(s.sport)+' '+SPORT[s.sport]+'</span>'+(S.done[s.date]?'<span class="donetag">'+ic("check")+' Done</span>':'')+'</div><h3>'+esc(s.title)+'</h3><div class="su">'+esc(s.sub)+'</div><div class="open">View steps '+ic("fwd")+'</div></button>';
  } else if(s){
    h+='<div class="sel-card quiet" style="--c:var(--'+s.sport+')"><div class="hd"><span>'+ic(s.sport==="busy"?"busy":"rest")+' '+SPORT[s.sport]+'</span></div><h3>'+esc(s.title)+'</h3><div class="su">'+(s.sport==="busy"?"No training planned. Your plan works around this.":esc(s.sub))+'</div></div>';
  }
  return h;

function overView(P){
  var tot=0,peak=0,longest=0;
  P.weeks.forEach(function(w){tot+=w.mins;peak=Math.max(peak,w.mins);w.days.forEach(function(d){if(d.mins>longest)longest=d.mins})});
  var cw=todayWeek(P),max=peak||1;
  var h='<h2 style="font-size:38px;line-height:1;margin:14px 0 2px;font-weight:800">The whole plan</h2><div class="note" style="margin:0 0 4px">Planned training time for every week. Tap a week to open it.</div>';
  h+='<div class="summary"><div class="sm"><b>'+Math.round(tot/60)+' h</b><small>total training</small></div><div class="sm"><b>'+(peak/60).toFixed(1)+' h</b><small>biggest week</small></div><div class="sm"><b>'+fmtMin(longest).replace(" min","m").replace(" h ","h ")+'</b><small>longest session</small></div></div>';
  h+='<div class="legend"><span class="ph-base"><i class="dot"></i>Base</span><span class="ph-build"><i class="dot"></i>Build</span><span class="ph-peak"><i class="dot"></i>Peak</span><span class="ph-taper"><i class="dot"></i>Taper</span></div>';
  P.weeks.forEach(function(w){
    var extra=[];if(w.swimD)extra.push(Math.round(w.swimD/100)*100+" "+swU()+" swim");if(w.bikeMin)extra.push(fmtMin(w.bikeMin)+" bike");if(w.runKm&&!isTri(S.profile.goal))extra.push(fmtKm(w.runKm));
    h+='<button class="orow ph-'+w.phase+(w.i===cw?" cur":"")+(w.rec?" rc":"")+'" data-act="jump" data-w="'+w.i+'"><span class="w">'+(w.i+1)+'</span><span><span class="bar"><i style="width:'+Math.max(3,Math.round(w.mins/max*100))+'%"></i></span><small>'+fmtDate(w.monday)+(w.rec?", recovery":"")+(extra.length?", "+extra.join(", "):"")+'</small></span><span class="h">'+(w.mins/60).toFixed(1)+' h</span></button>';
  });
  return h;
}

function zrows(label,fn){

  [1,2,3,4,5].forEach(function(z){h+='<tr><td><span class="zk" style="--zc:var(--z'+z+')"><i></i>Zone '+z+'</span></td><td>'+fn(z)+'</td></tr>'});
  return h+'</table></div>';
}

function coachView(P){
  var tk=dkey(sod(new Date())),w=findW(P,tk),has=!!(w&&w.sections),busy=S.chatBusy;
  var h='<div class="sec" style="margin-top:14px">Coach</div>';
  h+='<div class="note" style="margin:-4px 0 12px">'+(has?'Today: '+esc(w.title)+'. Your coach can see this session, your profile and your check-in.':'No workout today. Your coach can still help with recovery, how you feel and what is coming up.')+'</div>';
  h+=readyRow(tk);
  h+='<div class="coach chat"><div class="who"><span class="av">'+ic("spark")+'</span><div><b>Your coach</b><small>Ask about how you feel, what today should feel like, food, or anything in your plan</small></div></div>';
  if(!S.cc.length&&!busy)h+='<p>Tell me how you are feeling today, or ask how a session should feel. The more you tell me, the better I can tune the day for you.</p>';
  S.cc.forEach(function(m){h+='<div class="qb">'+esc(m.q)+'</div><div class="ab">'+paras(m.a)+'</div>'});
  if(busy)h+='<div class="qb">'+esc(S.chatQ)+'</div><div class="ab thinking" aria-label="Coach is thinking"><i></i><i></i><i></i></div>';
  if(S.coachErr&&!busy)h+='<div class="callout err" style="margin:10px 0 0">'+esc(S.coachErr)+'</div>';
  if(S.needPass)h+='<div class="askrow" style="margin-top:10px"><input id="passin" type="password" placeholder="Coach passcode" autocomplete="current-password"><button class="ib" data-act="savepass" aria-label="Save passcode">'+ic("check")+'</button></div>';
  h+='<div class="quick">'+CQUICK.map(function(q){return '<button data-act="askc" data-q="'+esc(q[1])+'"'+(busy?" disabled":"")+'>'+esc(q[0])+'</button>'}).join("")+'</div></div>';
  h+='<div class="chatbar"><div class="askrow"><input id="chatin" data-f="chatText" placeholder="Tell your coach how you feel, or ask anything" value="'+esc(S.chatText)+'" maxlength="500" autocomplete="off"'+(busy?" disabled":"")+'><button class="ib" data-act="askcgo" aria-label="Send message"'+(busy?" disabled":"")+'>'+ic("send")+'</button></div></div>';
  if(S.cc.length)h+='<button class="btn alt sm" style="margin-top:12px" data-act="clearcc">Clear this conversation</button>';
  return h;
}

function chartSvg(w){
  var seg=w.seg,tot=0;seg.forEach(function(s){tot+=s.sec});
  if(!tot)return "";
  var W_=340,H=128,base=106,x=0,out="",spans=[],cur=null;
  seg.forEach(function(s){
    var wd=s.sec/tot*W_,hh=s.zone===0?4:14+(s.zone-1)*17,bw=Math.max(1,wd-(wd>4?0.9:0));
    out+='<rect x="'+x.toFixed(1)+'" y="'+(base-hh)+'" width="'+bw.toFixed(1)+'" height="'+hh+'" rx="'+(bw>6?3:1)+'" style="fill:'+(s.zone===0?'var(--line2)':'var(--z'+s.zone+')')+'"/>';
    if(!cur||cur.kind!==s.kind){cur={kind:s.kind,x0:x,x1:x+wd};spans.push(cur)}else cur.x1=x+wd;
    x+=wd;
  });
  var abbr={wu:"WU",skl:"SKL",main:"MAIN",spd:"SPD",wd:"WD",brick:"BRICK"};
  if(w.sport==="swim")spans.forEach(function(s){
    out+='<rect x="'+s.x0.toFixed(1)+'" y="14" width="'+(s.x1-s.x0).toFixed(1)+'" height="'+(base-14)+'" fill="none" style="stroke:var(--k-'+s.kind+')" stroke-dasharray="3 3" opacity=".6" rx="3"/>';
    out+='<text class="sl" x="'+((s.x0+s.x1)/2).toFixed(1)+'" y="10" text-anchor="middle">'+(abbr[s.kind]||"")+'</text>';
  });
  var tm=tot/60,step=tm<=45?10:tm<=90?15:tm<=180?30:tm<=420?60:120;
  for(var t=0;t<=tm+0.01;t+=step)out+='<text class="ax" x="'+Math.min(W_-8,Math.max(0,t*60/tot*W_)).toFixed(1)+'" y="122" text-anchor="'+(t===0?"start":"middle")+'">'+t+'’</text>';
  var leg=[1,2,3,4,5].map(function(z){return '<span style="--zc:var(--z'+z+')"><i></i>Zone '+z+'</span>'}).join("");
  return '<div class="chart"><svg viewBox="0 0 '+W_+' '+H+'" role="img" aria-label="Workout intensity by time">'+out+'</svg><div class="zleg">'+leg+'</div></div>';
}

function zspan(z,sw){return '<span class="zc z'+z+'">'+(sw?"Z":"z")+z+'</span>'}
function paceFor(it,w,zn){
  var Z=ZC,sp=it.sp||w.sport;
  if(sp==="swim")return swimRange(Z.swim.z[zn]);
  if(sp==="run"){var h=hrZ(Z,zn);return paceRange(Z.run.z[zn])+(h?", "+h:"")}
  return bikeZoneText(zn);
}

function itemHtml(it,w,sec){
  var k="--k:var(--k-"+sec.kind+")";
  if(it.k==="note")return '<div class="it" style="'+k+'"><div class="nt" style="margin:0;color:var(--ink);font-size:15px">'+esc(it.text)+'</div></div>';
  if(it.k==="rep"){
    var inner=it.items.map(function(x){return itemHtml(x,w,sec)}).join("");
    return '<div class="rep"><div class="rh">'+ic("loop")+'Repeat '+it.n+'x'+(it.tag?' &nbsp;'+esc(it.tag):'')+'</div>'+inner+(it.rest?'<span class="rest">'+it.rest+'s rest between</span>':'')+'</div>';
  }
  var sw=(w.sport==="swim"&&!it.sp);
  var rest=it.rest?'<span class="rest">'+it.rest+'s rest</span>':(sw?'<span class="rest">Open rest</span>':'');
  if(it.parts){
    var lines=it.parts.map(function(pt){return '<div class="ln"><b>'+pt.dist+'</b>'+swU()+' '+esc(pt.text)+' '+zspan(pt.zone,1)+(pt.drill?'':' <span style="color:var(--mute);font-size:14px">'+swimRange(ZC.swim.z[pt.zone])+'</span>')+'</div>'}).join("");
    return '<div class="it" style="'+k+'"><div class="big"><b>'+it.dist+'</b>'+swU()+' as</div>'+lines+rest+'</div>';
  }
  if(sw){
    var zl=it.zoneSeq?it.zoneSeq.map(function(z,i){return '<div class="ln">'+(i+1)+'&nbsp; '+zspan(z,1)+' <span style="color:var(--mute);font-size:14px">'+swimRange(ZC.swim.z[z])+'</span></div>'}).join(""):"";
    return '<div class="it" style="'+k+'"><div class="big"><b>'+it.dist+'</b>'+swU()+' '+esc(it.text)+(it.zoneSeq?'':' at '+zspan(it.zone,1))+'</div>'+(it.zoneSeq?zl:'<div class="sb">'+swimRange(ZC.swim.z[it.zone])+'</div>')+(it.note?'<div class="nt">'+esc(it.note)+'</div>':'')+rest+'</div>';
  }
  var tag=(sec.kind==="wu"||sec.kind==="wd"||sec.kind==="main"||sec.kind==="brick")?'<span class="tg">'+esc(sec.name.replace(" set",""))+'</span>':'';
  return '<div class="it" style="'+k+'">'+tag+'<div class="big">'+durHtml(it.sec)+' at '+zspan(it.zone,0)+'</div><div class="sb">'+paceFor(it,w,it.zone)+'</div>'+(it.note?'<div class="nt">'+esc(it.note)+'</div>':'')+'</div>';
}
function workoutText(w,P){
  ZC=P.Z;var d=pdate(w.date),L=[w.title+" ("+SPORT[w.sport]+")",DAYL[(d.getDay()+6)%7]+" "+d.getDate()+" "+MON[d.getMonth()],""];
  w.sections.forEach(function(s){L.push(s.name.toUpperCase());s.items.forEach(function(it){L.push("- "+itemTxt(it,w))});L.push("")});
  return L.join("\n");
}

function sheet(P){
  var w=findW(P,S.open);if(!w)return "";
  ZC=P.Z;
  var d=pdate(w.date),list=allW(P),ix=-1,done=!!S.done[w.date];
  list.forEach(function(x,i){if(x.date===w.date)ix=i});
  var fh={run:"While you run",swim:"In the pool",bike:"On the bike",race:"Race plan"}[w.sport];
  var h='<div class="sheet'+(S.pop?" pop":"")+'" style="--c:var(--'+w.sport+')"><div class="in">';
  h+='<div class="sbar"><button class="ib" data-act="close" aria-label="Close workout">'+ic("down")+'</button><div class="grp"><button class="ib" data-act="nav" data-d="-1" '+(ix<=0?"disabled":"")+' aria-label="Previous workout">'+ic("back")+'</button><button class="ib" data-act="nav" data-d="1" '+(ix<0||ix>=list.length-1?"disabled":"")+' aria-label="Next workout">'+ic("fwd")+'</button></div></div>';
  h+='<div class="whead"><div class="kick">'+ic(w.sport)+SPORT[w.sport]+(done?' <span class="donetag">'+ic("check")+' Done</span>':'')+'</div><h1>'+esc(w.title)+'</h1><div class="d">'+DAYL[(d.getDay()+6)%7]+', '+d.getDate()+' '+MON[d.getMonth()]+'</div>';
  var tg=(w.tags||[]).slice();if(w.daysToRace>0)tg.push(w.daysToRace+" days to race");
  if(tg.length)h+='<div class="tags">'+tg.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("")+'</div>';
  h+='</div>';
  if(w.sport!=="race"){
    var dv=w.sport==="swim"?[Math.round(w.dist).toLocaleString("en-US"),swU()]:kmParts(w.dist);
    var dl=dv[0]+'<i>'+dv[1]+'</i>';
    if(w.sport==="bike"&&w.brickKm){var bp=kmParts(w.brickKm);dl+='<i>+ '+bp[0]+' '+bp[1]+' run</i>'}
    var pc,pl="Pace";
    if(w.sport==="swim")pc=fmtT(w.pace)+'<i>/100'+swU()+'</i>';
    else if(w.sport==="run")pc=fmtPace(w.pace)+'<i>'+paceUnit()+'</i>';
    else{var sp=spdParts(w.dist/(w.mins/60));pc=sp[0]+'<i>'+sp[1]+'</i>';pl="Avg speed"}
    h+='<div class="stats"><div class="st"><small>'+ic("clock")+'Time</small><b>'+fmtMin(w.mins)+'</b></div><div class="st"><small>'+ic("route")+'Distance</small><b>'+dl+'</b></div><div class="st"><small>'+ic("gauge")+pl+'</small><b>'+pc+'</b></div>';
    h+='<div class="st"><small>'+ic("load")+'Load</small><b>'+w.load.toFixed(1)+'<i>of 10</i></b></div><div class="st"><small>'+ic("bolt")+'Intensity</small><b><span class="bars l'+w.intensity+'"><s></s><s></s><s></s></span>'+["","Low","Moderate","High"][w.intensity]+'</b></div><div class="st"><small>'+ic("fuel")+'Nutrition</small><b>'+(w.carbs?w.carbs+'<i>g carbs</i>':'Water')+'</b></div></div>';
    h+=chartSvg(w);
    h+=readyRow(w.date);
    h+=coachCard(w,P);
  }
  h+='<div class="sec">Workout steps</div><div class="rail">';
  w.sections.forEach(function(sec){
    var f=w.sport==="race"?"":feelFor(sec,w);
    h+='<div class="rsec" style="--k:var(--k-'+sec.kind+')"><div class="sp">'+esc(sec.name)+'</div>';
    h+=sec.items.map(function(it){return itemHtml(it,w,sec)}).join("");
    if(f)h+='<div class="feel"><i>Should feel:</i> '+esc(f)+'</div>';
    h+='</div>';
  });
  h+='</div><div class="cards2" style="margin-top:6px">';
  if(w.cues.length){h+='<div class="info"><h3>'+ic(w.sport)+fh+'</h3><ul class="list">';w.cues.forEach(function(f){h+='<li>'+esc(f)+'</li>'});h+='</ul></div>'}
  if(w.fuel.length){h+='<div class="info" style="--c:var(--swim)"><h3>'+ic("fuel")+'Fuel and recovery</h3><ul class="list">';w.fuel.forEach(function(f){h+='<li>'+esc(f)+'</li>'});h+='</ul></div>'}
  h+='</div>';
  if((w.sport==="run"&&P.Z.run.est)||(w.sport==="swim"&&P.Z.swim.est))h+='<div class="note">Paces are estimates from your experience level. Add a recent time in Setup to personalise them.</div>';
  h+='</div><div class="dock"><div class="in"><button class="btn main'+(done?" good":"")+'" data-act="done" data-k="'+w.date+'">'+ic("check")+(done?"Done. Tap to undo":"Mark as done")+'</button><button class="ib" data-act="copyw" data-k="'+w.date+'" aria-label="Copy workout as text" style="width:54px;height:54px;border-radius:16px;flex:none">'+ic("copy")+'</button></div></div></div>';
  return h;
}

function mainView(){
  var P=plan(),cur=P.weeks[todayWeek(P)];
  var body=S.tab==="plan"?planView(P):S.tab==="over"?overView(P):S.tab==="coach"?coachView(P):profView(P);
  var tabs=[["plan","Plan","cal"],["over","Overview","chart"],["coach","Coach","spark"],["prof","Profile","user"]].map(function(t){return '<button class="'+(S.tab===t[0]?"on":"")+'" data-act="tab" data-v="'+t[0]+'">'+ic(t[2])+t[1]+'</button>'}).join("");
  return '<div class="top"><div class="in"><div class="brand">'+MARK+'Raceplan</div><span class="chip ph-'+cur.phase+'"><i class="dot"></i>Week '+(cur.i+1)+' of '+P.N+'</span></div></div><main class="wrap">'+body+'</main>'+(S.open?sheet(P):"")+(S.checkin?checkinSheet():"")+'<nav class="tabs"><div class="bar">'+tabs+'</div></nav>';
}

/* ============ onboarding ============ */
function raceList(d){
  var today=sod(new Date()),h="",list=RACES.filter(function(r){return r.t===d.goal&&diffDays(pdate(r.d),today)>=14}).sort(function(a,b){return a.d<b.d?-1:1});
  var minW={ironman:20,"703":12}[d.goal];
  h+='<div class="fld">Pick your race<small>Dates as of 28 Oct 2026. Confirm on ironman.com before registering.</small></div><div class="opts" style="margin-top:8px">';
  list.forEach(function(r){
    var dt=pdate(r.d),wks=Math.round(diffDays(dt,today)/7);
    h+='<button class="rcard'+(d.raceId===r.id?" on":"")+'" data-act="race" data-v="'+r.id+'"><span class="rdt"><small>'+MON[dt.getMonth()]+'</small><b>'+dt.getDate()+'</b></span><span class="tx"><b>'+esc(r.n)+'</b><span>'+esc(r.pl)+', '+DAYS[(dt.getDay()+6)%7]+' '+dt.getFullYear()+(wks<minW?'. Short build.':'')+'</span></span><span class="rwk'+(wks<minW?" warn":"")+'">'+wks+'<small>weeks</small></span></button>';
  });
  h+='<button class="opt'+(d.raceId==="custom"?" on":"")+'" data-act="race" data-v="custom"><span class="tx"><b>Another race or date</b><span class="s">Enter your own event</span></span><span class="ck">'+ic("check")+'</span></button></div>';
  if(d.raceId==="custom"){
    h+='<label class="fld">Race name<input data-f="customName" value="'+esc(d.customName)+'" placeholder="e.g. IRONMAN Arizona"></label>';
    h+='<label class="fld">Race date<input type="date" data-f="raceDate" value="'+esc(d.raceDate)+'"></label>';
  }
  return h;
}

function onboard(){
  var d=S.draft,imp=d.units==="imperial",tri=isTri(d.goal),st=S.step,h='<div class="top"><div class="in"><div class="brand">'+MARK+'Raceplan</div>'+(S.editing?'<button class="linkbtn" data-act="cancel">Cancel</button>':'')+'</div></div><main class="wrap ob">';

    h+='<h2>What are you racing?</h2><p>Pick your race and we’ll work backwards from race day.</p><div class="opts">';

      h+='<button class="opt'+(d.goal===g?" on":"")+'" data-act="goal" data-v="'+g+'"><span class="tx"><b>'+GOALS[g].name+'</b><span class="s">'+GOALS[g].sub+'</span></span><span class="ck">'+ic("check")+'</span></button>';

      h+='<div class="fld">Training to include<small>Running is always in. Swimming and cycling are added as cross-training.</small><div class="tog"><button class="opt on" disabled style="opacity:.7;justify-content:center"><b>Run</b></button><button class="opt'+(d.swim?" on":"")+'" data-act="tog" data-v="swim" style="justify-content:center"><b>Swim</b></button><button class="opt'+(d.bike?" on":"")+'" data-act="tog" data-v="bike" style="justify-content:center"><b>Bike</b></button></div></div>';

    h+='<div class="fld">Races finished at this distance'+pills("priorFinishes",d.priorFinishes,[["none","None yet"],["1-2","One or two"],["3+","Three or more"]])+'</div>';
  } else if(st===1){
    h+='<h2>About you</h2><p>Body stats shape your fuelling numbers, heart-rate zones and how your coach talks to you. Everything here is optional.</p>';
    h+='<div class="fld">Units<div class="seg" style="margin-top:6px"><button class="'+(!imp?"on":"")+'" data-act="units" data-v="metric">Metric (m, km)</button><button class="'+(imp?"on":"")+'" data-act="units" data-v="imperial">Imperial (yd, mi)</button></div></div>';
    h+='<div class="fld">Sex'+pills("sex",d.sex,[["female","Female"],["male","Male"],["other","Prefer not to say"]])+'</div>';
    h+='<div class="row2"><label class="fld">Age<input inputmode="numeric" data-f="age" value="'+esc(d.age)+'" placeholder="e.g. 34"></label><label class="fld">Weight ('+(imp?"lb":"kg")+')<input inputmode="decimal" data-f="wRaw" value="'+esc(d.wRaw)+'" placeholder="'+(imp?"165":"75")+'"></label></div>';
    h+='<label class="fld">Height ('+(imp?"in":"cm")+')<input inputmode="decimal" data-f="hRaw" value="'+esc(d.hRaw)+'" placeholder="'+(imp?"69":"175")+'"></label>';
  } else if(st===2){
    h+='<h2>Your experience</h2><p>Rate yourself separately for each sport. A strong runner can be a new swimmer, and the plan treats each one differently.</p>';
    h+=lvBlock("lvRun","Running",LVD.run,d.lvRun);
    if(inclSwim)h+=lvBlock("lvSwim","Swimming",LVD.swim,d.lvSwim);
    if(inclBike)h+=lvBlock("lvBike","Cycling",LVD.bike,d.lvBike);

  } else {
    h+='<h2>Your week and gear</h2><p>Mark days you can train. If you lift, climb or do something else, mark it busy and the plan works around it, spacing hard sessions away from those days.'+(tri?' Ironman training works best with 5 or more training days.':'')+'</p>';

function bikeZoneText(z){

function parseHM(s){
  if(s==null||!String(s).trim())return null;
  var p=String(s).trim().split(":").map(Number);
  if(p.some(function(x){return isNaN(x)})||p.length<2||p.length>3)return null;
  var v=p[0]*3600+p[1]*60+(p[2]||0);
  return v>0?v:null;
}

function readyScore(r,p){
  var W_={sleep:0.25,qual:0.15,energy:0.25,sore:0.2,stress:0.15},tot=0,sum=0;
  function add(k,v){tot+=W_[k];sum+=W_[k]*v}
  if(r.sleep!=null)add("sleep",clamp((r.sleep-4.5)/4,0,1)*100);
  if(r.qual!=null)add("qual",(r.qual-1)/4*100);
  if(r.energy!=null)add("energy",(r.energy-1)/4*100);
  if(r.sore!=null)add("sore",(5-r.sore)/4*100);
  if(r.stress!=null)add("stress",(5-r.stress)/4*100);
  if(!tot)return null;
  var sc=sum/tot;
  if(r.rhr&&p.restHR)sc-=clamp(r.rhr-p.restHR,0,15);
  if(/fever|sick|\bill\b|flu\b|injur|sharp pain|dizzy|chest/i.test(r.notes||""))sc=Math.min(sc,30);
  return Math.round(clamp(sc,0,100));
}

function readyBand(sc){
  if(sc>=75)return {k:"green",name:"Ready",tip:"Go as planned."};
  if(sc>=55)return {k:"yellow",name:"Okay",tip:"Go as planned, but stay at the easy end of each pace range."};
  if(sc>=35)return {k:"orange",name:"Tired",tip:"Cut the session by about a quarter and ease off the hardest parts."};
  return {k:"red",name:"Run down",tip:"Consider rest, or an easy spin or walk. If you feel ill or in pain, skip it."};
}

function readyFor(date){
  var r=S.ready[date];if(!r)return null;

  return {score:sc,band:readyBand(sc),r:r};
}

}

function askCoach(date,q){
  q=String(q||"").trim().slice(0,500);
  if(!q||S.busy)return;
  var P=plan(),w=findW(P,date);if(!w||!w.sections)return;
  var body={question:q,athlete:athleteCtx(P),readiness:readyCtx(date),workout:workoutCtx(w,P),history:chatFor(date).slice(-3).map(function(m){return {q:m.q,a:m.a}})};
  S.busy=date;S.coachErr="";S.askText="";
  render();
  postCoach(body)
    .then(function(a){
      var list=S.chat[date]||(S.chat[date]=[]);
      list.push({q:q,a:a,t:Date.now()});
      if(list.length>8)list.shift();
      save();
    })
    .catch(function(e){S.coachErr=coachErrMsg(e)})
    .then(function(){S.busy=null;render()});
}

function postCoach(body){
  var headers={"Content-Type":"application/json"};if(S.pass)headers["x-app-passcode"]=S.pass;
  var ctrl=window.AbortController?new AbortController():null,to=setTimeout(function(){if(ctrl)ctrl.abort()},50000);
  return fetch("api/coach",{method:"POST",headers:headers,body:JSON.stringify(body),signal:ctrl?ctrl.signal:undefined})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {r:r,j:j}})})
    .then(function(o){
      if(o.r.status===401){S.needPass=true;throw new Error("This coach needs your passcode.")}
      if(!o.r.ok||!o.j.answer)throw new Error(o.j.message||"The coach could not answer right now. Try again in a moment.");
      return String(o.j.answer).slice(0,3500);
    })
    .then(function(a){clearTimeout(to);return a},function(e){clearTimeout(to);throw e});
}

function coachErrMsg(e){
  if(e&&e.name==="AbortError")return "The coach took too long. Try again.";
  if(e&&e.name==="TypeError")return "Can’t reach the coach. Start the app with npm start and open http://localhost:3000 (see the README).";
  return (e&&e.message)||"The coach could not answer right now.";
}

  var body={mode:"chat",question:q,athlete:athleteCtx(P),readiness:readyCtx(tk),
    workout:has?workoutCtx(w,P):null,
    today:{date:tk,restDay:!has,nextWorkout:nx?{date:nx.date,title:nx.title,sport:nx.sport}:null},
    history:S.cc.slice(-6).map(function(m){return {q:m.q,a:m.a}})};
  S.chatBusy=true;S.chatQ=q;S.coachErr="";S.chatText="";CHATFOCUS=true;
  render();
  postCoach(body)
    .then(function(a){
      S.cc.push({q:q,a:a,t:Date.now()});

function doLogin(){
  var name=String(S.loginText||"").trim().replace(/\s+/g," ");
  if(S.loginBusy)return;
  if(!/^[A-Za-z0-9][A-Za-z0-9 _.-]{1,29}$/.test(name)){S.loginErr="Use 2 to 30 letters, numbers, spaces, dots, dashes or underscores.";render();return}
  var pi=document.getElementById("loginpass");
  if(pi&&pi.value){S.pass=pi.value;try{localStorage.setItem(KEY+".pass",S.pass)}catch(e){}}
  S.loginBusy=true;S.loginErr="";render();
  userApi({action:"login",username:name}).then(function(j){
    finishLogin(j.username,j.display,j.data,j.ts);
  }).catch(function(e){
    // Local-only mode is for running on your own computer (or a file) without a server. On the hosted site, show the real problem.
    var local=location.protocol==="file:"||location.hostname==="localhost"||location.hostname==="127.0.0.1";
    if(e&&local&&(e.name==="TypeError"||e.code==="not_configured"))finishLogin(name.toLowerCase(),name,null,0);
    else if(e&&e.name==="TypeError")S.loginErr="Can’t reach the server. Check your connection and try again.";
    else S.loginErr=(e&&e.code==="passcode")?"Enter the passcode to continue.":((e&&e.message)||"Could not log in. Try again.");
  }).then(function(){S.loginBusy=false;render()});
}
function finishLogin(username,display,data,ts){
  S.user=username;S.display=display||username;
  try{localStorage.setItem(KEY+".user",S.user);localStorage.setItem(KEY+".disp",S.display)}catch(e){}
  clearData();
  var local=readLocal(),best=null,migrate=false,st=Number(ts)||0;
  if(data&&(!local||st>=(Number(local.ts)||0)))best=Object.assign({},data,{ts:st});
  else if(local)best=local;
  if(!best){
    // New account: the first one on this browser adopts a plan saved before accounts existed.
    try{var lj=localStorage.getItem(KEY);if(lj){var lo=JSON.parse(lj);if(lo&&lo.profile){best=lo;migrate=true;localStorage.removeItem(KEY)}}}catch(e){}
  }
  if(best)applyData(best);
  if(S.profile){try{S.week=todayWeek(plan())}catch(e){S.week=0}}else S.draft=defaultDraft();
  S.anim=true;S.loginText="";S.loginErr="";
  if(migrate)save();else if(S.profile&&S.ts>st)syncUp();
  window.scrollTo(0,0);
  pushInit();
}
function pushCleanup(){
  if(!("serviceWorker" in navigator)||!/^https?:$/.test(location.protocol))return Promise.resolve();
  return navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription()}).then(function(sub){
    if(!sub)return;
    return postPush("unsubscribe",sub).catch(function(){}).then(function(){return sub.unsubscribe()});
  }).catch(function(){});
}
function doLogout(){
  if(S.leaving)return;
  S.leaving=true;render();
  var wait=new Promise(function(r){setTimeout(r,4000)});
  Promise.race([Promise.all([syncUp(),pushCleanup()]),wait]).then(function(){
    try{localStorage.removeItem(KEY+".user");localStorage.removeItem(KEY+".disp")}catch(e){}
    S.user="";S.display="";S.ts=0;clearData();S.leaving=false;S.loginText="";S.loginErr="";
    render();window.scrollTo(0,0);
  });
}
