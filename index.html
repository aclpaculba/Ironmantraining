function pushEnv(){
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var standalone=navigator.standalone===true||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
  var secure=location.protocol==="https:"||location.hostname==="localhost";
  var ok=secure&&("serviceWorker" in navigator)&&("PushManager" in window)&&("Notification" in window);
  return {ios:ios,standalone:standalone,secure:secure,ok:ok,perm:("Notification" in window)?Notification.permission:"denied"};
}
function b64ToBytes(s){
  var p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")),o=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;
}
function upcomingDays(){
  var P=plan(),tk=dkey(sod(new Date())),end=dkey(new Date(Date.now()+28*864e5)),o={};
  allW(P).forEach(function(w){
    if(w.date<tk||w.date>end)return;
    o[w.date]={t:w.title,s:[w.mins?fmtMin(w.mins):"",w.sub||""].filter(Boolean).join(" · ")};
  });
  return o;
}
function postPush(action,sub){
  var headers={"Content-Type":"application/json"};if(S.pass)headers["x-app-passcode"]=S.pass;
  var body={action:action,subscription:sub.toJSON?sub.toJSON():sub};
  if(action==="subscribe"||action==="update"){body.tz=Intl.DateTimeFormat().resolvedOptions().timeZone;body.time=S.rtime;body.days=upcomingDays()}
  return fetch("api/push",{method:"POST",headers:headers,body:JSON.stringify(body)}).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(r.status===401){S.needPass=true;throw new Error("Enter your passcode in the Coach tab first.")}
      if(!r.ok)throw new Error(j.message||"Something went wrong. Try again.");
      return j;
    });
  });
}
function pushInit(){
  if(!("serviceWorker" in navigator)||!/^https?:$/.test(location.protocol))return;
  navigator.serviceWorker.register("sw.js").then(function(){return navigator.serviceWorker.ready}).then(function(reg){
    return reg.pushManager?reg.pushManager.getSubscription():null;
  }).then(function(sub){
    S.pushOn=!!sub&&pushEnv().perm==="granted";
    if(S.pushOn&&S.profile&&Date.now()-SYNCT>36e5){SYNCT=Date.now();postPush("update",sub).catch(function(){})}
    if(S.tab==="prof"&&S.ptab==="set"&&!S.open)render();
  }).catch(function(){});
  fetch("api/push").then(function(r){return r.json()}).then(function(j){S.pushCfg=j&&j.ok?j:{vapid:false,store:false};if(S.tab==="prof"&&S.ptab==="set"&&!S.open)render()}).catch(function(){S.pushCfg={vapid:false,store:false}});
}
function pushOn(){
  var env=pushEnv();
  if(!env.ok||!S.pushCfg||!S.pushCfg.publicKey||S.pushBusy)return;
  S.pushBusy=true;S.pushMsg="";render();
  Notification.requestPermission().then(function(perm){
    if(perm!=="granted")throw new Error("Notifications were not allowed. You can change this in the iPhone Settings app under Raceplan, then Notifications.");
    return navigator.serviceWorker.ready;
  }).then(function(reg){
    return reg.pushManager.getSubscription().then(function(old){return old||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(S.pushCfg.publicKey)})});
  }).then(function(sub){return postPush("subscribe",sub).then(function(){return sub})}).then(function(sub){
    S.pushOn=true;S.pushMsg="Reminders are on. Sending a test now.";SYNCT=Date.now();
    return postPush("test",sub);
  }).catch(function(e){S.pushMsg=(e&&e.message)||"Could not turn on reminders."})
  .then(function(){S.pushBusy=false;render()});
}
function pushOff(){
  if(S.pushBusy)return;
  S.pushBusy=true;S.pushMsg="";render();
  navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription()}).then(function(sub){
    if(!sub)return;
    return postPush("unsubscribe",sub).catch(function(){}).then(function(){return sub.unsubscribe()});
  }).then(function(){S.pushOn=false;S.pushMsg="Reminders are off."}).catch(function(e){S.pushMsg=(e&&e.message)||"Could not turn off reminders."})
  .then(function(){S.pushBusy=false;render()});
}
function pushTest(){
  if(S.pushBusy)return;
  S.pushBusy=true;S.pushMsg="";render();
  navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription()}).then(function(sub){
    if(!sub)throw new Error("Reminders are not on yet.");
    return postPush("test",sub);
  }).then(function(){S.pushMsg="Test sent. It should arrive in a few seconds."}).catch(function(e){S.pushMsg=(e&&e.message)||"Could not send a test."})
  .then(function(){S.pushBusy=false;render()});
}
function pushSync(){
  if(!S.pushOn||!S.profile)return;
  navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription()}).then(function(sub){
    if(sub)return postPush("update",sub).then(function(){S.pushMsg="Reminder time saved.";if(S.tab==="prof"&&S.ptab==="set"&&!S.open)render()});
  }).catch(function(e){S.pushMsg=(e&&e.message)||"Could not save the reminder time.";if(S.tab==="prof"&&S.ptab==="set"&&!S.open)render()});
}
function pushPanel(){
  var env=pushEnv(),cfg=S.pushCfg,h='<div class="sec">Reminders</div><div class="panel" style="padding:14px 16px">',note=function(t){return '<div class="note" style="margin:0">'+t+'</div>'};
  if(!/^https?:$/.test(location.protocol)||!env.secure)h+=note("Reminders need the hosted version of the app (https). Open it from your Vercel link.");
  else if(env.ios&&!env.standalone)h+=note("To get reminders on iPhone, add Raceplan to your Home Screen first: in Safari tap the Share button, then Add to Home Screen. Then open Raceplan from its new icon and come back here.");
  else if(!env.ok)h+=note("This browser does not support push notifications.");
  else if(!cfg)h+=note("Checking the reminder service…");
  else if(!cfg.vapid||!cfg.store)h+=note("Reminders are not set up on the server yet. Add the VAPID keys and Supabase settings, then redeploy (see the README).");
  else if(env.perm==="denied")h+=note("Notifications are blocked for Raceplan. On iPhone open Settings, then Notifications, then Raceplan, and turn on Allow Notifications.");
  else{
    h+=note("Get a note each morning with today’s workout, on your training days.");
    h+='<label class="fld" style="margin:12px 0 0">Reminder time<input id="rtime" type="time" data-f="rtime" value="'+esc(S.rtime)+'"></label>';
    h+='<div style="display:grid;gap:8px;margin-top:12px">';
    if(S.pushOn)h+='<button class="btn alt sm" data-act="pushtest"'+(S.pushBusy?" disabled":"")+'>Send a test notification</button><button class="btn alt sm" data-act="pushoff"'+(S.pushBusy?" disabled":"")+'>Turn reminders off</button>';
    else h+='<button class="btn" data-act="pushon"'+(S.pushBusy?" disabled":"")+'>'+(S.pushBusy?"Working…":"Turn on reminders")+'</button>';
    h+='</div>';
  }
  if(S.pushMsg)h+='<div class="note" style="margin:10px 0 0">'+esc(S.pushMsg)+'</div>';
  return h+'</div>';
}

function paras(t){
  var s=String(t).replace(/\*\*/g,"").replace(/^#+\s*/gm,"").replace(/`/g,"");
  return esc(s).split(/\n{2,}/).map(function(p){return '<p>'+p.replace(/\n/g,"<br>")+'</p>'}).join("");
}

/* ============ render + events ============ */
function countUp(){
  var els=document.querySelectorAll("[data-count]");
  if(!els.length)return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var t0=performance.now(),dur=1200;
  els.forEach(function(el){el.textContent="0"});
  function tick(t){
    var k=clamp((t-t0)/dur,0,1),e=1-Math.pow(1-k,4);
    els.forEach(function(el){el.textContent=Math.round(Number(el.dataset.count)*e)});
    if(k<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function toast(msg,undoKey){
  var old=document.querySelector(".toast");if(old)old.remove();
  var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");
  t.innerHTML=esc(msg)+(undoKey?'<button data-act="undo" data-k="'+esc(undoKey)+'">Undo</button>':"");
  document.body.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.remove()},2800);
}
function copyText(t){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);return true}}catch(e){}
  var ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);return ok;
}
function render(){
  var app=$("#app"),sh=document.querySelector(".sheet:not(.two)"),st=sh?sh.scrollTop:0,ws=window.scrollY;
  var doAnim=!!(S.anim&&S.profile&&!S.editing&&S.tab==="plan");
  try{
    if(!S.user)app.innerHTML=loginView();else if(!S.profile||S.editing)app.innerHTML=onboard();else app.innerHTML=mainView();
  }catch(e){
    app.innerHTML='<main class="wrap"><div class="callout err">Something went wrong building the plan. '+esc(e&&e.message)+'</div><button class="btn" data-act="reset">Start over</button></main>';
  }
  S.pop=false;
  document.body.style.overflow=((S.open||S.checkin)&&S.profile)?"hidden":"";
  var sh2=document.querySelector(".sheet:not(.two)");if(sh2&&st)sh2.scrollTop=st;
  if(ws)window.scrollTo(0,ws);
  if(CHATSCROLL||CHATFOCUS){
    if(S.tab==="coach"&&S.profile&&!S.open&&!S.checkin){
      window.scrollTo(0,document.documentElement.scrollHeight);
      var ci=document.getElementById("chatin");if(CHATFOCUS&&ci&&!ci.disabled)ci.focus({preventScroll:true});
    }
    CHATSCROLL=CHATFOCUS=false;
  }
  if(doAnim){S.anim=false;countUp()}
}
function validate(){
  var d=S.draft,today=sod(new Date());
  if(S.step===0){
    if(isTri(d.goal)){
      if(!d.raceId)return "Pick a race from the list, or choose another date.";
      if(d.raceId==="custom"&&(!d.raceDate||diffDays(pdate(d.raceDate),today)<14))return "Choose a race date at least two weeks from today.";
    } else {
      if(!d.raceDate)return "Pick your race date.";
      if(diffDays(pdate(d.raceDate),today)<14)return "Choose a race date at least two weeks from today.";
    }
    if(d.goalType==="time"&&!parseHM(d.goalTime))return "Enter your target time as h:mm, for example 4:30.";
  }
  if(S.step===5&&d.avail.every(function(a){return a==="busy"}))return "Mark at least one day you can train.";
  return "";
}

var PENDING=null;

function act(a,ds){
  var d=S.draft;
  switch(a){
    case "tab":S.tab=ds.v;S.open=null;S.checkin=null;if(ds.v==="plan")S.anim=true;if(ds.v==="prof")pingCoach();if(ds.v==="coach"){CHATSCROLL=true;pingCoach()}window.scrollTo(0,0);break;
    case "ptab":S.ptab=ds.v;window.scrollTo(0,0);break;
    case "login":doLogin();return;
    case "logout":doLogout();return;
    case "pushon":pushOn();return;
    case "pushoff":pushOff();return;
    case "pushtest":pushTest();return;
    case "askc":askChat(ds.q);return;
    case "askcgo":askChat(S.chatText);return;
    case "clearcc":S.cc=[];S.coachErr="";save();break;
    case "wk":S.week=clamp(S.week+Number(ds.d),0,plan().N-1);S.sel=null;break;
    case "thisweek":S.week=todayWeek(plan());S.sel=null;break;
    case "jump":S.week=Number(ds.w);S.sel=null;S.tab="plan";window.scrollTo(0,0);break;
    case "sel":S.sel=ds.k;break;
    case "open":S.open=ds.k;S.pop=true;S.coachErr="";S.askText="";break;
    case "close":S.open=null;S.checkin=null;break;
    case "nav":{var list=allW(plan()),ix=-1;list.forEach(function(x,i){if(x.date===S.open)ix=i});var n=list[ix+Number(ds.d)];if(n){S.open=n.date;S.sel=n.date;S.coachErr="";S.askText="";var wi=0;plan().weeks.forEach(function(wk,i){if(wk.days.some(function(x){return x.date===n.date}))wi=i});S.week=wi}break}
    case "done":{var was=!!S.done[ds.k];if(was)delete S.done[ds.k];else S.done[ds.k]=1;save();PENDING=[was?"Marked not done":"Marked as done",ds.k];break}
    case "undo":if(S.done[ds.k])delete S.done[ds.k];else S.done[ds.k]=1;save();break;
    case "copyw":{var wk2=findW(plan(),ds.k);if(wk2){var ok=copyText(workoutText(wk2,plan()));toast(ok?"Workout copied":"Copy was blocked on this device")}return}
    case "checkin":S.checkin={date:ds.k,r:clone(S.ready[ds.k]||{})};S.pop=true;break;
    case "rset":S.checkin.r[ds.k]=Number(ds.v);break;
    case "rsave":{var rr=S.checkin.r;S.ready[S.checkin.date]=rr;S.checkin=null;save();PENDING=["Check-in saved",null];break}
    case "rclose":S.checkin=null;break;
    case "ask":askCoach(S.open,ds.q);return;
    case "askgo":askCoach(S.open,S.askText);return;
    case "savepass":{var pi=document.getElementById("passin");S.pass=pi?pi.value:"";try{localStorage.setItem(KEY+".pass",S.pass)}catch(e){}S.needPass=false;S.coachErr="";break}
    case "clearchat":S.chat={};S.cc=[];save();break;
    case "edit":S.draft=clone(Object.assign(defaultDraft(),S.profile.draft));S.step=0;S.err="";S.editing=true;S.open=null;S.checkin=null;window.scrollTo(0,0);break;
    case "cancel":S.editing=false;S.draft=null;S.err="";break;
    case "reset":
      if(!S.profile){S.draft=defaultDraft();S.step=0;break}
      if(!S.confirm){S.confirm=true;break}
      S.profile=null;S.done={};S.ready={};S.chat={};S.cc=[];S.ptab="you";S.confirm=false;S.editing=false;PLAN=null;S.draft=defaultDraft();S.step=0;S.tab="plan";save();break;
    case "goal":if(d.goal!==ds.v){d.goal=ds.v;d.raceId="";if(isTri(ds.v)){d.swim=true;d.bike=true}}S.err="";break;
    case "race":d.raceId=ds.v;S.err="";break;
    case "tog":d[ds.v]=!d[ds.v];break;
    case "units":d.units=ds.v;break;
    case "set":d[ds.f]=ds.v;S.err="";break;
    case "flag":d[ds.f]=!d[ds.f];break;
    case "multi":{
      var arr=d[ds.f]||(d[ds.f]=[]),i=arr.indexOf(ds.v);
      if(ds.v==="none"){d[ds.f]=i>=0?[]:["none"]}
      else{if(i>=0)arr.splice(i,1);else arr.push(ds.v);var ni=arr.indexOf("none");if(ni>=0)arr.splice(ni,1)}
      break}
    case "avail":d.avail[Number(ds.d)]=ds.v;S.err="";break;
    case "back":S.step=Math.max(0,S.step-1);S.err="";window.scrollTo(0,0);break;
    case "next":
      S.err=validate();
      if(S.err)break;
      if(S.step<5){S.step++;window.scrollTo(0,0);break}
      S.profile=finalize(d);PLAN=null;S.draft=null;S.editing=false;S.step=0;S.tab="plan";S.open=null;S.checkin=null;S.confirm=false;S.anim=true;S.sel=null;
      try{S.week=todayWeek(plan())}catch(e){S.week=0}
      save();pushSync();window.scrollTo(0,0);break;
  }
  if(a!=="reset")S.confirm=false;
  render();
  if(PENDING){toast(PENDING[0],PENDING[1]);PENDING=null}
}

function onField(t){
  if(!t.dataset||!t.dataset.f)return;
  var f=t.dataset.f;
  if(f==="askText"){S.askText=t.value;return}
  if(f==="chatText"){S.chatText=t.value;return}
  if(f==="loginText"){S.loginText=t.value;return}
  if(f==="rtime"){
    if(/^\d\d:\d\d$/.test(t.value)){S.rtime=t.value;save();clearTimeout(SYNCT2);SYNCT2=setTimeout(pushSync,700)}
    return;
  }
  if(S.checkin&&(f==="rhr"||f==="rnotes")){
    if(f==="rhr"){var v=parseFloat(t.value);S.checkin.r.rhr=isFinite(v)&&v>0?v:null}else S.checkin.r.notes=t.value;
    return;
  }
  if(!S.draft)return;
  if(f==="busy")S.draft.busy[Number(t.dataset.d)]=t.value;else S.draft[f]=t.value;
}

function init(){
  load();
  S.anim=true;
  if(!S.profile)S.draft=defaultDraft();
  else{try{S.week=todayWeek(plan())}catch(e){S.week=0}}
  document.addEventListener("click",function(e){var t=e.target.closest("[data-act]");if(t&&!t.disabled)act(t.dataset.act,t.dataset)});
  document.addEventListener("input",function(e){onField(e.target)});
  document.addEventListener("change",function(e){onField(e.target)});
  document.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&e.target&&e.target.id==="askin"){e.preventDefault();act("askgo",{});return}
    if(e.key==="Enter"&&e.target&&e.target.id==="chatin"){e.preventDefault();act("askcgo",{});return}
    if(e.key==="Enter"&&e.target&&(e.target.id==="loginin"||e.target.id==="loginpass")){e.preventDefault();act("login",{});return}
    if(e.key==="Escape"){if(S.checkin)act("rclose",{});else if(S.open)act("close",{})}
  });
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="hidden"){if(SYNCTO)syncUp(true)}
    else pullUser();
  });
  render();
  pushInit();
  pullUser();
}

if(typeof document!=="undefined"&&document.getElementById&&document.getElementById("app"))init();
</script>
